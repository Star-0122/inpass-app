<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>インパス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF5;
  --surface:#FFFFFF;
  --ink:#2E2019;
  --ink-soft:#8A7A6D;
  --ink-faint:#B9AB9E;
  --coral:#FF6F51;
  --coral-dark:#E5573B;
  --coral-soft:#FFE3DA;
  --teal:#1B9E92;
  --teal-dark:#12756C;
  --teal-soft:#DBF3EF;
  --sun:#FFB531;
  --sun-soft:#FFEFD1;
  --sky:#5B9BD9;
  --sky-soft:#E3EFFC;
  --line:#F1E6DA;
  --danger:#E5484D;
  --danger-soft:#FCE1E1;
  --ok:#3FA76B;
  --ok-soft:#E1F3E7;
  --warn:#E5A427;
  --warn-soft:#FCEED0;
  --shadow-sm:0 2px 8px rgba(46,32,25,.06);
  --shadow-md:0 10px 28px rgba(46,32,25,.10);
  --shadow-lg:0 18px 44px rgba(46,32,25,.16);
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
  --r-pill:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.jp-display{font-family:'M PLUS Rounded 1c','Zen Kaku Gothic New',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--coral-soft);}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}

/* ---------- App shell layout ---------- */
#root{min-height:100vh;display:flex;flex-direction:column;align-items:center;}

.mode-switch{
  width:100%;
  max-width:920px;
  display:flex;
  gap:8px;
  padding:10px 14px;
  justify-content:center;
  flex-wrap:wrap;
}
.mode-btn{
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  padding:8px 16px;
  border-radius:var(--r-pill);
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.02em;
  transition:.15s;
}
.mode-btn.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* ---------- Phone shell (user & staff) ---------- */
.phone-shell{
  width:100%;
  max-width:430px;
  height:100vh;
  height:100dvh; /* dynamic viewport height: correctly accounts for mobile browser UI (address bar etc.) */
  background:var(--bg);
  position:relative;
  box-shadow:var(--shadow-lg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media(min-width:520px){
  .phone-shell{
    height:860px;
    margin:16px auto 40px;
    border-radius:44px;
    border:8px solid var(--ink);
  }
}
@media (orientation:landscape) and (max-height:500px){
  .bottom-nav{ padding-top:4px; padding-bottom:calc(4px + env(safe-area-inset-bottom)); }
  .nav-item{ padding:3px 2px; }
  .nav-item svg{ width:18px; height:18px; }
}
.phone-notch{
  display:none;
}
@media(min-width:520px){
  .phone-notch{
    display:block;
    position:absolute;
    top:0;left:50%;transform:translateX(-50%);
    width:120px;height:22px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:50;
  }
}

.screen{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  scrollbar-width:none;
  position:relative;
}
.screen::-webkit-scrollbar{display:none;}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,251,245,.92);
  backdrop-filter:blur(10px);
  padding:16px 18px 10px;
  display:flex;align-items:center;gap:10px;
}
.topbar h1{margin:0;font-size:19px;font-weight:800;}
.back-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.back-btn svg{width:16px;height:16px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:auto;
}

/* Bottom nav */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  z-index:30;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);
  padding:6px 2px;border-radius:12px;
}
.nav-item svg{width:22px;height:22px;}
.nav-item span{font-size:10.5px;font-weight:700;}
.nav-item.active{color:var(--coral);}

/* iPhoneのみ：Liquid Glass風の半透明ガラス表示（Android/PCは既存デザインのまま） */
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)){
  html.iphone .bottom-nav{
    background:rgba(255,251,245,.68);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.55);
    border-radius:20px 20px 0 0;
    box-shadow:0 -4px 24px rgba(46,32,25,.08);
  }
  html.iphone .nav-item{ transition:transform .12s ease, opacity .12s ease; }
  html.iphone .nav-item:active{ transform:scale(0.90); opacity:.65; }
}

/* ---------- Generic components ---------- */
.section-title{
  font-size:15.5px;font-weight:800;margin:22px 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title .more{font-size:12px;color:var(--ink-soft);font-weight:700;}
.hscroll{
  display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;
  scrollbar-width:none;
}
.hscroll::-webkit-scrollbar{display:none;}

.event-card{
  flex-shrink:0;width:230px;background:var(--surface);
  border-radius:var(--r-md);box-shadow:var(--shadow-sm);
  overflow:hidden;border:1px solid var(--line);
}
.event-card.wide{width:100%;flex-shrink:1;display:flex;}
.event-hero{
  height:120px;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
}
.event-card.wide .event-hero{width:104px;height:auto;font-size:30px;flex-shrink:0;}
.event-body{padding:12px 13px 14px;flex:1;min-width:0;}
.event-cat-chip{
  position:absolute;top:9px;left:9px;
  background:rgba(255,255,255,.85);color:var(--ink);
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);
}
.fav-toggle{
  position:absolute;top:8px;right:8px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.88);border:none;
  display:flex;align-items:center;justify-content:center;
}
.fav-toggle svg{width:16px;height:16px;}
.event-name{font-size:14.5px;font-weight:800;margin:0 0 4px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.event-meta{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.event-meta svg{width:12px;height:12px;flex-shrink:0;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:0 18px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 15px;border-radius:var(--r-pill);
  background:var(--surface);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink-soft);
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:var(--r-pill);font-weight:800;font-size:14px;
  padding:14px 20px;width:100%;
}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 8px 18px rgba(255,111,81,.35);}
.btn-primary:active{background:var(--coral-dark);}
.btn-secondary{background:var(--teal-soft);color:var(--teal-dark);}
.btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
.btn-sm{padding:9px 14px;font-size:12.5px;width:auto;}
.btn:disabled{opacity:.45;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);}
.pad{padding:16px 18px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);}
.badge-green{background:var(--ok-soft);color:var(--ok);}
.badge-yellow{background:var(--warn-soft);color:var(--warn);}
.badge-red{background:var(--danger-soft);color:var(--danger);}
.badge-outline{background:var(--sky-soft);color:var(--sky);}
.badge-ended{background:#EFE9E2;color:var(--ink-faint);}
.status-chip{position:absolute;bottom:9px;left:9px;font-size:10px;padding:3px 9px;}
.share-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;}
.share-btn svg{width:16px;height:16px;}
.geo-banner{margin:0 18px 14px;padding:12px 14px;border-radius:var(--r-md);background:var(--sky-soft);color:var(--sky);font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.geo-banner button{flex-shrink:0;background:var(--sky);color:#fff;border:none;border-radius:var(--r-pill);padding:7px 12px;font-size:11.5px;font-weight:800;}
.myevent-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);margin:0 18px 10px;}
.myevent-row .em{font-size:26px;width:42px;text-align:center;flex-shrink:0;}
.postevent-hero{margin:14px 18px;padding:20px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--teal-soft),var(--sky-soft));text-align:center;}
.postevent-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px 14px;}
.postevent-link{padding:14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);text-align:center;font-size:12.5px;font-weight:800;}
.danger-zone{margin:20px 18px;padding:16px;border-radius:var(--r-md);border:1.5px solid var(--danger-soft);background:#FFFBFA;}
.btn-danger,.danger-zone .btn-danger{background:var(--danger);color:#fff;}

.empty-state{padding:60px 30px;text-align:center;color:var(--ink-soft);}
.empty-state .em{font-size:38px;margin-bottom:10px;}

.hr{height:1px;background:var(--line);margin:14px 0;border:none;}

/* Search */
.search-box{
  margin:4px 18px 14px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;padding:12px 16px;
}
.search-box input{border:none;background:none;outline:none;font-size:14px;width:100%;color:var(--ink);}
.search-box svg{width:17px;height:17px;flex-shrink:0;color:var(--ink-faint);}
.field-label{font-size:12px;font-weight:800;color:var(--ink-soft);margin:16px 18px 8px;}
.field-input{
  margin:0 18px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:11px 13px;font-size:13.5px;width:calc(100% - 36px);outline:none;color:var(--ink);
}

/* Detail tabs */
.detail-hero{height:230px;position:relative;display:flex;align-items:flex-end;}
.detail-hero-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:78px;}
.detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%);}
.detail-top-actions{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:5;}
.circle-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;}
.circle-btn svg{width:17px;height:17px;}
.detail-header-text{position:absolute;bottom:16px;left:18px;right:18px;color:#fff;z-index:5;}
.detail-header-text h2{font-size:21px;margin:0 0 6px;font-weight:800;}
.detail-header-text .meta{font-size:12.5px;opacity:.92;display:flex;gap:6px;align-items:center;}

.tabbar{
  display:flex;gap:6px;overflow-x:auto;padding:14px 18px 10px;
  position:sticky;top:0;background:var(--bg);z-index:15;scrollbar-width:none;
  border-bottom:1px solid var(--line);
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbtn{flex-shrink:0;padding:8px 14px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.tabbtn.active{background:var(--coral);border-color:var(--coral);color:#fff;}

.sched-row{display:flex;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);}
.sched-time{font-weight:800;font-size:13.5px;width:52px;flex-shrink:0;color:var(--coral-dark);}
.sched-title{font-size:13.5px;font-weight:700;}
.sched-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.notice-item{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;}
.notice-item.important{background:var(--coral-soft);}
.notice-dot{width:8px;height:8px;border-radius:50%;background:var(--coral);margin-top:6px;flex-shrink:0;}
.notice-item.important .notice-dot{background:var(--danger);}
.notice-date{font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
.notice-title{font-size:13.5px;font-weight:800;}
.notice-body{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}

.map-wrap{margin:10px 18px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
.map-svg{width:100%;display:block;background:#EAF4EE;}
.map-pin{cursor:pointer;}
.map-legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 4px;}
.legend-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);}
.legend-dot{width:9px;height:9px;border-radius:50%;}

.congestion-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.congestion-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;}

.heat-hero{margin:14px 18px;padding:18px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--warn-soft),var(--sun-soft));text-align:center;}
.heat-hero .lvl{font-size:26px;font-weight:800;margin:6px 0;}
.heat-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 18px;}
.heat-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 8px;text-align:center;}
.heat-stat .val{font-size:17px;font-weight:800;}
.heat-stat .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 18px;}
.photo-tile{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;}

.ticket-type-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);margin:0 18px 10px;}
.ticket-type-name{font-size:13.5px;font-weight:800;}
.ticket-type-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}

/* My ticket card */
.mticket{margin:0 18px 16px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);position:relative;}
.mticket-top{padding:18px 20px;color:#fff;position:relative;}
.mticket-top .tname{font-size:15.5px;font-weight:800;margin:0 0 4px;}
.mticket-top .tdate{font-size:12px;opacity:.9;}
.mticket-punch{position:relative;height:0;}
.mticket-punch::before,.mticket-punch::after{
  content:'';position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg);
}
.mticket-punch::before{left:-10px;}
.mticket-punch::after{right:-10px;}
.mticket-bottom{background:var(--surface);padding:16px 20px 18px;border-top:2px dashed var(--line);}
.qr-box{display:flex;justify-content:center;padding:10px 0 6px;}
.ticket-id-text{text-align:center;font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(46,32,25,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:520px){.modal-overlay{align-items:center;}}
.modal-sheet{background:var(--surface);width:100%;max-width:430px;border-radius:26px 26px 0 0;padding:22px;max-height:85vh;overflow-y:auto;}
@media(min-width:520px){.modal-sheet{border-radius:26px;}}
.modal-handle{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 16px;}

.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);
  font-size:13px;font-weight:700;z-index:300;box-shadow:var(--shadow-md);
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.menu-list{margin:6px 18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.menu-row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;}
.menu-row:last-child{border-bottom:none;}
.menu-row svg{width:18px;height:18px;color:var(--ink-soft);}
.menu-row .chev{margin-left:auto;width:14px;height:14px;color:var(--ink-faint);}

/* ---------- Splash ---------- */
.splash{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease, transform .5s ease;
}
.splash.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
.splash-mark{width:92px;height:92px;opacity:0;transform:scale(.4);animation:markIn .55s cubic-bezier(.2,1.4,.4,1) .12s forwards;}
@keyframes markIn{to{opacity:1;transform:scale(1);}}
.splash-word{display:flex;overflow:hidden;margin-top:16px;}
.splash-word span{
  font-family:'M PLUS Rounded 1c';font-weight:800;font-size:30px;color:var(--ink);
  opacity:0;transform:translateY(6px);animation:letterIn .38s ease forwards;
}
@keyframes letterIn{to{opacity:1;transform:translateY(0);}}
.splash-tag{margin-top:10px;font-size:13px;color:var(--ink-soft);font-weight:700;opacity:0;animation:fadeIn .5s ease .95s forwards;letter-spacing:.02em;}
@keyframes fadeIn{to{opacity:1;}}

/* ---------- Admin (desktop dashboard) ---------- */
.admin-shell{width:100%;max-width:1180px;padding:0 20px 60px;}
.admin-topbar{display:flex;align-items:center;gap:14px;padding:22px 4px 18px;flex-wrap:wrap;}
.admin-topbar h1{font-size:22px;font-weight:800;margin:0;}
.admin-topbar .sub{font-size:12.5px;color:var(--ink-soft);}
.admin-layout{display:flex;gap:20px;}
.admin-side{width:190px;flex-shrink:0;}
.admin-nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);
  font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;border:none;background:none;width:100%;text-align:left;
}
.admin-nav-item.active{background:var(--ink);color:#fff;}
.admin-main{flex:1;min-width:0;}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm);}
.stat-card .num{font-size:24px;font-weight:800;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}.admin-layout{flex-direction:column;}.admin-side{width:100%;display:flex;gap:6px;overflow-x:auto;}}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th{text-align:left;font-size:11.5px;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line);}
.table td{padding:11px 10px;border-bottom:1px solid var(--line);}
.admin-form-row{margin-bottom:14px;}
.admin-form-row label{display:block;font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;}
.admin-form-row input,.admin-form-row select,.admin-form-row textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:13.5px;outline:none;color:var(--ink);
}
.admin-form-row textarea{resize:vertical;min-height:70px;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer;}
.swatch.sel{border-color:var(--ink);}

/* Staff */
.staff-shell{padding:26px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%;}
.staff-scanner{
  width:230px;height:230px;border-radius:28px;background:var(--ink);
  display:flex;align-items:center;justify-content:center;margin:26px 0;position:relative;overflow:hidden;
}
.staff-scanner svg{width:80px;height:80px;color:#fff;opacity:.85;}
.staff-scanner video{width:100%;height:100%;object-fit:cover;}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:var(--coral);box-shadow:0 0 12px 2px var(--coral);animation:scanmove 1.6s ease-in-out infinite;}
@keyframes scanmove{0%{top:12%;}50%{top:88%;}100%{top:12%;}}
.result-card{width:100%;max-width:340px;border-radius:var(--r-lg);padding:26px 22px;margin-top:8px;}
.result-card .icon{font-size:40px;margin-bottom:8px;}
.result-card .status{font-size:17px;font-weight:800;margin-bottom:4px;}
.result-card .desc{font-size:12.5px;opacity:.85;}

@media(max-width:400px){.jp-display{letter-spacing:0;}}

/* ---------- Auth / status / banner additions ---------- */
.status-banner{
  position:fixed;top:0;left:0;right:0;z-index:200;
  width:100%;max-width:430px;margin:0 auto;padding:9px 16px;text-align:center;
  font-size:11.5px;font-weight:700;line-height:1.5;
}
.status-banner.demo{background:#FFF3D6;color:#8A6A1A;}
.status-banner.offline{background:var(--danger-soft);color:var(--danger);}
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg);border-radius:var(--r-pill);padding:4px;}
.auth-tab{flex:1;text-align:center;padding:9px 0;border-radius:var(--r-pill);font-size:12.5px;font-weight:800;color:var(--ink-soft);border:none;background:none;}
.auth-tab.active{background:var(--surface);color:var(--coral-dark);box-shadow:var(--shadow-sm);}
.form-field{margin-bottom:12px;}
.form-field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;}
.form-field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:14px;outline:none;color:var(--ink);}
.form-error{background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:700;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:12px;}
.form-note{font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.6;}
.role-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:var(--r-pill);background:var(--sky-soft);color:var(--sky);margin-left:6px;}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--line) 25%,#F8F0E8 37%,var(--line) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r-sm);}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.mock-flag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:var(--ink-faint);border:1px solid var(--line);padding:1px 7px;border-radius:var(--r-pill);margin-left:6px;vertical-align:1px;}

   下記の supabaseConfig にプロジェクトのURLとanon keyを設定すると、

   検証されるようになります。設定方法は README.md を参照してください。
   ============================================================ */
const supabaseConfig = {
  url: "https://vpbygbpjbgtbdmqqpour.supabase.co",
  anonKey: "sb_publishable_gQ-chZ137ZdweXsnFc2XqA_5OoQrKEx",

const CLOUD_MODE = !!(supabaseConfig.url && supabaseConfig.anonKey
  && !supabaseConfig.url.startsWith("YOUR_") && !supabaseConfig.anonKey.startsWith("YOUR_"));

/* iPhone判定（iPadやAndroidには適用しない）。Liquid Glass風の下部バー表示にのみ使用。 */
const _ua = navigator.userAgent;
const _isIPadOSDisguisedAsMac = /Macintosh/.test(_ua) && navigator.maxTouchPoints > 1; // iPadOS 13+

/* ------------------------------------------------------------
   ⚠️ 開発・確認用パスワード（本番の権限管理ではありません）
   ------------------------------------------------------------
   「メニュー → アプリモード」から主催者／スタッフ画面を開く際の、
   誰でも入力できてしまう画面上部の切り替えボタンを廃止するための
   簡易的なUI上のロックです。実際のデータ操作（イベント編集・
   チェックインなど）は、これとは独立して Supabase の RLS / RPC
   （schema.sql参照）がサーバー側で権限チェックを行っています。
   このパスワードを知っているだけでは、本物の主催者・スタッフ権限
   は一切付与されません。本番運用では、Supabase側でrole（admin_set_role
   関数など）を正しく付与したアカウントでログインしてください。
------------------------------------------------------------- */

let sb = null; // Supabase client（クラウドモード時のみセット）
async function bootSupabase(){
  if(!CLOUD_MODE) return false;
  try{
    const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
    sb = createClient(supabaseConfig.url, supabaseConfig.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    return true;
  }catch(err){
    console.error("Supabase init failed", err);
    return false;
  }
}

/* Friendly Japanese error mapping（ローカルモードのコード／Supabaseのメッセージの両方に対応） */
function friendlyError(err){
  const code = err && err.code ? err.code : "";
  const msg = (err && err.message) ? String(err.message) : "";
  const map = {
    "auth/invalid-email":"メールアドレスの形式が正しくありません。",
    "auth/email-already-in-use":"このメールアドレスはすでに登録されています。",
    "auth/weak-password":"パスワードは6文字以上で設定してください。",
    "auth/wrong-password":"メールアドレスまたはパスワードが正しくありません。",
    "auth/user-not-found":"メールアドレスまたはパスワードが正しくありません。",
    "storage-unavailable":"このブラウザではデータの保存機能が利用できません（プライベートブラウジング中は保存できない場合があります）。",
    "organizer-required":"イベントの作成には「主催者」権限が必要です。Supabaseの profiles テーブルで、ご自身の role を organizer（または admin）に変更してください。",
  };
  if(map[code]) return map[code];
  // Supabaseのエラーメッセージ（英語）をよくあるパターンで日本語化
  const patterns = [
    [/invalid login credentials/i, "メールアドレスまたはパスワードが正しくありません。"],
    [/user already registered/i, "このメールアドレスはすでに登録されています。"],
    [/password should be at least/i, "パスワードは6文字以上で設定してください。"],
    [/email not confirmed/i, "メールアドレスの確認が完了していません。届いた確認メールをご確認ください。"],
    [/rate limit/i, "試行回数が多すぎます。しばらくしてからもう一度お試しください。"],
    [/network/i, "通信に失敗しました。インターネット接続を確認してください。"],
    [/fetch/i, "通信に失敗しました。インターネット接続を確認してください。"],
    [/jwt|permission|policy|rls/i, "この操作を行う権限がありません。"],
  ];
  for(const [re,jp] of patterns){ if(re.test(msg)) return jp; }
  if(msg) console.error('Unmapped error (showing generic Japanese message to user):', msg);
  return "データを取得できませんでした。通信環境を確認して、もう一度お試しください。";
}

/* =================================================================
   DATA LAYER — Firebaseなし。すべてブラウザの localStorage に保存する。
   EP コントローラは常に下記の DATA.* 経由でデータ操作を行う
   （インターフェースを保つことで、将来サーバーを追加する場合も
   このレイヤーだけ差し替えればよい構成にしている）。
================================================================== */
const LS_PREFIX = "inpass_v1_";
const LS_KEYS = {
  users:LS_PREFIX+"users", session:LS_PREFIX+"session", events:LS_PREFIX+"events",
  tickets:LS_PREFIX+"tickets", favorites:LS_PREFIX+"favorites", notices:LS_PREFIX+"notices",
  congestion:LS_PREFIX+"congestion", photos:LS_PREFIX+"photos", checkins:LS_PREFIX+"checkins",
};
function lsGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ S.storageOK=false; return false; }
}
function simpleHash(pw){
  // 本格的な暗号学的ハッシュではありません。サーバーを持たないローカル版の
  // 簡易的な難読化です（README にその旨明記）。
  let h=0; for(let i=0;i<pw.length;i++){h=(h*31+pw.charCodeAt(i))>>>0;}
  return "h"+h.toString(36);
}
function nowStamp(){
  const d=new Date();
  return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtTimestamp(ts){ return ts||""; }

const LOCAL_DATA = {
  async init(){
    // 保存済みのイベント（主催者が作成したもの）があれば読み込み、なければ初期データを保存
    const savedEvents = lsGet(LS_KEYS.events, null);
    if(savedEvents && Array.isArray(savedEvents) && savedEvents.length){
      EVENTS.splice(0, EVENTS.length, ...savedEvents);
    }else{
      lsSet(LS_KEYS.events, EVENTS);
    }
    EVENTS.forEach(ev=>{
      const allNotices = lsGet(LS_KEYS.notices, {});
      S.notices[ev.id] = allNotices[ev.id] || ev.notices.map((n,i)=>({...n, id:ev.id+"-n"+i}));
      const allCongestion = lsGet(LS_KEYS.congestion, {});
      if(allCongestion[ev.id]){ S.congestion[ev.id] = allCongestion[ev.id]; }
      else{
        const c = {};
        ev.congestionSpots.forEach((sp,i)=>{ c[sp] = {level:i%3, updatedAt:null}; });
        S.congestion[ev.id] = c;
      }
      const allPhotos = lsGet(LS_KEYS.photos, {});
      S.photos[ev.id] = allPhotos[ev.id] || [];
    });
    LOCAL_DATA.persistNotices(); LOCAL_DATA.persistCongestion(); LOCAL_DATA.persistPhotos();

    // セッション復元
    const session = lsGet(LS_KEYS.session, null);
    if(session && session.uid){
      const user = LOCAL_DATA.findUserByUid(session.uid);
      if(user){
        S.currentUser = {uid:user.uid, email:user.email, name:user.name, notificationEnabled:user.notificationEnabled!==false};
        S.userRole = user.role || "user";
        LOCAL_DATA.loadFavorites(user.uid);
        LOCAL_DATA.loadTickets(user.uid);
      }
    }
    S.loadingEvents = false;
    render();
  },

  persistEvents(){ lsSet(LS_KEYS.events, EVENTS); },
  persistNotices(){ lsSet(LS_KEYS.notices, S.notices); },
  persistCongestion(){ lsSet(LS_KEYS.congestion, S.congestion); },
  persistPhotos(){ lsSet(LS_KEYS.photos, S.photos); },
  persistTickets(){ lsSet(LS_KEYS.tickets, S.allTickets || []); },

  getUsers(){ return lsGet(LS_KEYS.users, []); },
  saveUsers(list){ lsSet(LS_KEYS.users, list); },
  findUserByEmail(email){ return LOCAL_DATA.getUsers().find(u=>u.email.toLowerCase()===String(email).toLowerCase()); },
  findUserByUid(uid){ return LOCAL_DATA.getUsers().find(u=>u.uid===uid); },

  loadFavorites(uid){
    const all = lsGet(LS_KEYS.favorites, {});
    S.favorites = new Set(all[uid] || []);
  },
  loadTickets(uid){
    const all = lsGet(LS_KEYS.tickets, []);
    S.allTickets = all;
    S.tickets = all.filter(t=>t.userId===uid);
  },

  /* ---- Auth ---- */
  async signUp(email,password,name){
    if(LOCAL_DATA.findUserByEmail(email)){ throw {code:"auth/email-already-in-use"}; }
    if(!password || password.length<6){ throw {code:"auth/weak-password"}; }
    const uid = "u_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const users = LOCAL_DATA.getUsers();
    users.push({uid, email, name, role:"user", pw:simpleHash(password), createdAt:nowStamp(), notificationEnabled:true});
    LOCAL_DATA.saveUsers(users);
    S.currentUser = {uid, email, name, notificationEnabled:true}; S.userRole = "user";
    lsSet(LS_KEYS.session, {uid});
    LOCAL_DATA.loadFavorites(uid); LOCAL_DATA.loadTickets(uid);
  },
  async logIn(email,password){
    const user = LOCAL_DATA.findUserByEmail(email);
    if(!user || user.pw !== simpleHash(password)){ throw {code:"auth/wrong-password"}; }
    S.currentUser = {uid:user.uid, email:user.email, name:user.name, notificationEnabled:user.notificationEnabled!==false}; S.userRole = user.role || "user";
    lsSet(LS_KEYS.session, {uid:user.uid});
    LOCAL_DATA.loadFavorites(user.uid); LOCAL_DATA.loadTickets(user.uid);
  },
  async logOut(){
    S.currentUser = null; S.userRole = "guest";
    S.favorites = new Set(); S.tickets = [];
    try{ localStorage.removeItem(LS_KEYS.session); }catch(e){}
  },
  async setNotificationPref(uid, enabled){
    const users = LOCAL_DATA.getUsers();
    const u = users.find(x=>x.uid===uid);
    if(u){ u.notificationEnabled = enabled; LOCAL_DATA.saveUsers(users); }
    if(S.currentUser && S.currentUser.uid===uid) S.currentUser.notificationEnabled = enabled;
  },
  async deleteAccount(uid){
    // ユーザー情報を削除
    const users = LOCAL_DATA.getUsers().filter(u=>u.uid!==uid);
    LOCAL_DATA.saveUsers(users);
    // このユーザーのお気に入りを削除
    const favs = lsGet(LS_KEYS.favorites, []).filter(f=>f.userId!==uid);
    lsSet(LS_KEYS.favorites, favs);
    // このユーザーのチケットを削除（主催者側の集計に必要な checkins ログは残す）
    const tickets = lsGet(LS_KEYS.tickets, []).filter(t=>t.userId!==uid);
    lsSet(LS_KEYS.tickets, tickets);
    // セッションを終了
    try{ localStorage.removeItem(LS_KEYS.session); }catch(e){}
    S.currentUser = null; S.userRole = "guest";
    S.favorites = new Set(); S.tickets = []; S.allTickets = tickets;
  },
  async resetPassword(email, newPassword){
    const user = LOCAL_DATA.findUserByEmail(email);
    if(!user){ throw {code:"auth/user-not-found"}; }
    if(!newPassword || newPassword.length<6){ throw {code:"auth/weak-password"}; }
    const users = LOCAL_DATA.getUsers();
    const u = users.find(x=>x.uid===user.uid);
    u.pw = simpleHash(newPassword);
    LOCAL_DATA.saveUsers(users);
  },
  async completePasswordReset(){ /* ローカルモードではメールリンク方式を使わないため呼ばれない */ },
  async listStaff(){ return []; },

    const newEv = {
      id, name:payload.title, category:payload.category||"その他",

      organizer:S.currentUser.name||S.currentUser.email, catch:"", desc:payload.description||"",
      status:"published", organizerId:S.currentUser.uid,
      days:[payload.startDate], schedule:{[payload.startDate]:[]}, notices:[], congestionSpots:[],
      mapPins:[], heat:{temp:"-",humidity:"-",wbgt:"-",level:"情報なし",notes:[]}, photos:[],
      ticketTypes:[{id:"tt1",name:"入場チケット",price:0,note:payload.time||""}],

    EVENTS.unshift(newEv);

  async updateEventRemote(eventId, patch){
    const ev = getEvent(eventId);
    if(!ev) return;
    if(patch.title!==undefined) ev.name = patch.title;
    if(patch.description!==undefined) ev.desc = patch.description;
    if(patch.category!==undefined) ev.category = patch.category;
    if(patch.venue!==undefined) ev.venue = patch.venue;
    if(patch.startDate!==undefined) ev.dateStart = patch.startDate;
    if(patch.endDate!==undefined) ev.dateEnd = patch.endDate;
    LOCAL_DATA.persistEvents();

  async postAnnouncement(eventId,title,body,important){
    S.notices[eventId] = S.notices[eventId]||[];
    S.notices[eventId].unshift({id:uid("n"),title,body,important,date:nowStamp()});
    LOCAL_DATA.persistNotices();
  },
  async removeAnnouncementRemote(eventId,noticeId){
    S.notices[eventId] = (S.notices[eventId]||[]).filter(n=>n.id!==noticeId);
    LOCAL_DATA.persistNotices();
  },
  async setCrowdStatus(eventId,locationId,level){
    S.congestion[eventId] = S.congestion[eventId]||{};
    S.congestion[eventId][locationId] = {level, updatedAt:nowStamp()};
    LOCAL_DATA.persistCongestion();
  },
  async uploadPhoto(eventId,file,onProgress){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      let pct=0;
      const timer = setInterval(()=>{ pct=Math.min(90,pct+30); onProgress && onProgress(pct); }, 150);
      reader.onload = ()=>{
        clearInterval(timer); onProgress && onProgress(100);
        S.photos[eventId] = S.photos[eventId]||[];
        S.photos[eventId].unshift({id:uid("p"), imageUrl:reader.result, caption:""});
        const ok = LOCAL_DATA.persistPhotos();
        if(!ok){ reject({code:"storage-unavailable"}); return; }
        resolve(reader.result);
      };
      reader.onerror = ()=>{ clearInterval(timer); reject({message:"画像の読み込みに失敗しました。"}); };
      reader.readAsDataURL(file);
    });
  },
  async uploadAvatar(){ throw {message: S.lang==='en' ? 'Profile photos require cloud mode.' : 'プロフィール画像の変更にはクラウドモードが必要です。'}; },
  async removeAvatar(){ /* ローカルモードでは常に未設定のため何もしない */ },

  /* ---- Check-in（このブラウザ内で完結。サーバーがないため、他の
     デバイスからの二重チェックインは防げない点に注意 — README参照） ---- */
  async checkInTicket(ticketId, eventId){
    const all = lsGet(LS_KEYS.tickets, []);
    const t = all.find(x=>x.id===ticketId);
    if(!t){ return {status:"invalid", ticketId}; }
    if(t.eventId !== eventId){ return {status:"invalid", ticketId}; }
    if(t.status==="used"){ return {status:"used", ticketId, typeName:t.typeName}; }
    t.status="used"; t.checkedInAt=nowStamp();
    lsSet(LS_KEYS.tickets, all);
    const checkins = lsGet(LS_KEYS.checkins, []);
    checkins.unshift({ticketId, eventId, userId:t.userId, staffId:S.currentUser?S.currentUser.uid:null, checkedInAt:nowStamp()});
    lsSet(LS_KEYS.checkins, checkins);
    S.allTickets = all;
    if(S.currentUser) S.tickets = all.filter(x=>x.userId===S.currentUser.uid);
    return {status:"ok", ticketId, typeName:t.typeName};
  },
};

/* =================================================================
   CLOUD_DATA — Supabase（Postgres + Auth + Storage + Realtime）版。
   supabaseConfig が設定されている場合のみ使用される。
   LOCAL_DATA と同じメソッド名・引数で実装することで、EP コントローラ
   側のコードを変更せずに切り替えられるようにしている。
================================================================== */
function rowToEvent(r){
  return {
    id: r.id, name: r.title, category: r.category || "その他",
    dateStart: r.start_date, dateEnd: r.end_date || r.start_date,
    startTime: r.start_time ? String(r.start_time).slice(0,5) : "09:00",
    endTime: r.end_time ? String(r.end_time).slice(0,5) : "18:00",
    venue: r.venue || "", region: (r.prefecture||"")+(r.city||""),
    lat: r.lat, lng: r.lng,
    organizer: r.organizer_name || "", organizerId: r.organizer_id,
    catch: r.tagline || "", desc: r.description || "", status: r.status || "published",
    days: (r.days && r.days.length) ? r.days : [r.start_date],
    schedule: r.schedule || {}, notices: [], congestionSpots: r.congestion_spots || [],
    mapPins: r.map_pins || [], heat: r.heat || {temp:"-",humidity:"-",wbgt:"-",level:"情報なし",notes:[]},
    photos: [], ticketTypes: (r.ticket_types && r.ticket_types.length) ? r.ticket_types : [{id:"tt1",name:"入場チケット",price:0,note:""}],
  };
}
function rowToTicket(r){
  return {
    id: r.ticket_code, eventId: r.event_id, typeId: r.ticket_type, typeName: r.ticket_type_name,
    status: r.status, issuedAt: fmtTimestamp(r.issued_at), userId: r.user_id,
  };
}

const CLOUD_DATA = {
  _channels: [],
  async init(){
    const ok = await bootSupabase();
    if(!ok || !sb){
      toast('Supabaseへの接続に失敗しました。設定（supabaseConfig）をご確認ください。');
      EVENTS.splice(0, EVENTS.length, ...SEED_EVENTS.map(e=>JSON.parse(JSON.stringify(e))));
      EVENTS.forEach(ev=>{ S.notices[ev.id]=ev.notices.map((n,i)=>({...n,id:ev.id+'-n'+i})); S.congestion[ev.id]={}; S.photos[ev.id]=[]; });
      S.loadingEvents = false; render();
      return;
    }
    sb.auth.onAuthStateChange(async (event, session)=>{
      if(event === 'PASSWORD_RECOVERY'){ S.showAuthModal='newPassword'; S.authError=''; render(); return; }
      if(event === 'SIGNED_OUT'){ S.currentUser=null; S.userRole='guest'; S.favorites=new Set(); S.tickets=[]; render(); return; }
      if(session && session.user && (!S.currentUser || S.currentUser.uid!==session.user.id)){
        await CLOUD_DATA._loadProfile(session.user); render();
      }
    });
    const { data:{ session } } = await sb.auth.getSession();
    if(session && session.user){ await CLOUD_DATA._loadProfile(session.user); }

    await CLOUD_DATA.refreshEvents();
    CLOUD_DATA._subscribeRealtime();
    S.loadingEvents = false;
    render();
  },
  async _loadProfile(user){
    let { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if(!data) data = { id:user.id, name:user.user_metadata?.name||'', role:'user', notification_enabled:true, avatar_url:null };
    S.currentUser = { uid:user.id, email:user.email, name:data.name, notificationEnabled:data.notification_enabled!==false, avatarUrl:data.avatar_url||null };
    S.userRole = data.role || 'user';
    await CLOUD_DATA.loadFavorites(user.id);
    await CLOUD_DATA.loadTickets(user.id);
  },
  _subscribeRealtime(){
    const on = (name,table,fn)=> sb.channel(name).on('postgres_changes',{event:'*',schema:'public',table}, fn).subscribe();
    CLOUD_DATA._channels = [
      on('rt-events','events', ()=>CLOUD_DATA.refreshEvents()),
      on('rt-announcements','announcements', ()=>CLOUD_DATA.refreshAnnouncements()),
      on('rt-crowd','crowd_status', ()=>CLOUD_DATA.refreshCrowdStatus()),
      on('rt-photos','photos', ()=>CLOUD_DATA.refreshPhotos()),
      on('rt-tickets','tickets', ()=>{ if(S.currentUser) CLOUD_DATA.loadTickets(S.currentUser.uid).then(render); }),
    ];
  },
  async refreshEvents(){
    const { data, error } = await sb.from('events').select('*').order('start_date',{ascending:true});
    if(error){ console.error(error); return; }
    EVENTS.splice(0, EVENTS.length, ...(data||[]).map(rowToEvent));
    await CLOUD_DATA.refreshAnnouncements();
    await CLOUD_DATA.refreshCrowdStatus();
    await CLOUD_DATA.refreshPhotos();
    render();
  },
  async refreshAnnouncements(){
    const { data, error } = await sb.from('announcements').select('*').order('created_at',{ascending:false});
    if(error) return;
    const byEvent = {};
    (data||[]).forEach(r=>{ (byEvent[r.event_id] = byEvent[r.event_id]||[]).push({id:r.id,title:r.title,body:r.body,important:r.priority==='high',date:fmtTimestamp(r.created_at)}); });
    EVENTS.forEach(ev=>{ S.notices[ev.id] = byEvent[ev.id] || []; });
    render();
  },
  async refreshCrowdStatus(){
    const { data, error } = await sb.from('crowd_status').select('*');
    if(error) return;
    EVENTS.forEach(ev=>{
      const init = {};
      (ev.congestionSpots||[]).forEach((sp,i)=>{ init[sp] = {level:i%3, updatedAt:null}; });
      S.congestion[ev.id] = init;
    });
    (data||[]).forEach(r=>{ S.congestion[r.event_id] = S.congestion[r.event_id]||{}; S.congestion[r.event_id][r.location_id] = {level:r.status, updatedAt:r.updated_at}; });
    render();
  },
  async refreshPhotos(){
    const { data, error } = await sb.from('photos').select('*').order('created_at',{ascending:false});
    if(error) return;
    const byEvent = {};
    (data||[]).forEach(r=>{ (byEvent[r.event_id] = byEvent[r.event_id]||[]).push({id:r.id, imageUrl:r.image_url, caption:r.caption||''}); });
    EVENTS.forEach(ev=>{ S.photos[ev.id] = byEvent[ev.id] || []; });
    render();
  },

const DATA = CLOUD_MODE ? CLOUD_DATA : LOCAL_DATA;

function fmtRange(ev){
  if(ev.dateStart===ev.dateEnd) return ev.dateStart.replace(/-/g,"/");
  return ev.dateStart.replace(/-/g,"/") + " 〜 " + ev.dateEnd.slice(5).replace(/-/g,"/");
}
function uid(prefix){return prefix+Math.random().toString(36).slice(2,8).toUpperCase();}

/* ---------- Event status / countdown / price / distance helpers ---------- */
function getEventTimes(ev){
  const start = new Date((ev.dateStart||"2026-01-01")+"T"+(ev.startTime||"09:00")+":00");
  const end = new Date((ev.dateEnd||ev.dateStart||"2026-01-01")+"T"+(ev.endTime||"18:00")+":00");
  return {start,end};
}
function computeEventStatus(ev){
  const now = new Date();
  const {start,end} = getEventTimes(ev);
  if(now < start){
    const sameDay = now.toDateString()===start.toDateString();
    return sameDay ? {key:"today_before",label:"本日開催",cls:"badge-yellow"} : {key:"upcoming",label:"開催予定",cls:"badge-outline"};
  }
  if(now>=start && now<=end) return {key:"ongoing",label:"開催中",cls:"badge-green"};
  return {key:"ended",label:"終了しました",cls:"badge-ended"};
}
function computeCountdownText(ev){
  const now = new Date();
  const {start,end} = getEventTimes(ev);
  if(now>end) return "イベントは終了しました";
  if(now>=start) return "開催中！";
  const sameDay = now.toDateString()===start.toDateString();
  if(sameDay) return "本日開催！";
  const diffDays = Math.ceil((start-now)/86400000);
  if(diffDays<=1) return "いよいよ明日！";
  return `開催まであと${diffDays}日！`;
}
function formatPrice(price){
  const n = typeof price==="number" ? price : parseInt(price,10);
  if(!n || n<=0) return "無料";
  return n.toLocaleString("ja-JP")+"円";
}
function haversineKm(lat1,lng1,lat2,lng2){
  if([lat1,lng1,lat2,lng2].some(v=>v==null||isNaN(v))) return null;
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ---------- Render root ---------- */
function render(){
  const root = document.getElementById('root');
  // カメラで映像を映している最中は、画面全体の再描画（innerHTML差し替え）を行わない。
  // 再描画すると <video> 要素ごと作り直されてしまい、せっかく取得した映像が
  // 真っ黒になってしまうため（特にiPhoneで顕著）。裏側のデータ更新などは
  // いったん保留し、スキャン終了後（resetScan/cancelScan等）に反映される。
  if(S.cameraStream && S.staffScanState==='scanning'){
    const slot = document.getElementById('cameraSwitcherSlot');
    if(slot) slot.innerHTML = renderCameraSwitcherHTML();
    return;
  }
  try{
    let html = renderStatusBanners();
    if(S.mode==='user') html += renderUserApp();
    else if(S.mode==='admin' && canSwitchTo('organizer')) html += renderAdmin();
    else if(S.mode==='staff' && canSwitchTo('staff')) html += renderStaff();
    else { S.mode='user'; html += renderUserApp(); }

    if(S.showAppModeChooser) html += renderAppModeChooser();
    if(S.showLangPicker) html += renderLangPicker();
    if(S.showAuthModal) html += renderAuthModal();
    if(S.showSplash){
      html += renderSplash();
    }
    root.innerHTML = html;
    if(S.toastMsg){
      setTimeout(()=>{S.toastMsg=null; renderToastOnly();},1800);
    }
    attachSplashTimer();
  }catch(err){
    console.error('render() failed:', err);
    root.innerHTML = `<div style="max-width:430px;margin:60px auto;padding:28px;text-align:center;font-family:sans-serif;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:800;font-size:16px;margin-bottom:8px;">問題が発生しました / Something went wrong</div>
      <div style="font-size:13px;color:#8A7A6D;margin-bottom:18px;">一時的な不具合が発生しました。再読み込みをお試しください。<br>A temporary error occurred. Please reload.</div>
      <button onclick="location.reload()" style="background:#FF6F51;color:#fff;border:none;border-radius:999px;padding:12px 28px;font-weight:800;font-size:14px;">再読み込み / Reload</button>
    </div>`;
  }
}
function canSwitchTo(role){
  if(role==='organizer') return ['organizer','admin'].includes(S.userRole) || S.devModeUnlocked==='organizer';
  if(role==='staff') return ['staff','organizer','admin'].includes(S.userRole) || S.devModeUnlocked==='staff';
  return true;
}
function renderToastOnly(){
  const el = document.getElementById('toast-holder');
  if(el) el.remove();
}

/* ---------- Splash ---------- */
function renderSplash(){
  const first = S.isFirstLaunch;
  return `<div class="splash ${S.splashHide?'hide':''}" id="splashEl">
    <svg class="splash-mark" viewBox="0 0 100 100" fill="none">
      <rect x="8" y="24" width="84" height="52" rx="14" fill="#FF6F51"/>
      <circle cx="8" cy="50" r="9" fill="var(--bg)"/>
      <circle cx="92" cy="50" r="9" fill="var(--bg)"/>
      <path d="M50 34l4.2 9 9.9.9-7.5 6.6 2.3 9.7L50 55l-8.9 5.2 2.3-9.7-7.5-6.6 9.9-.9L50 34z" fill="#FFC145"/>
    </svg>
    <div class="splash-word jp-display">
      ${["イ","ン","パ","ス"].map((c,i)=>`<span style="animation-delay:${0.5+i*0.07}s">${c}</span>`).join('')}
    </div>
    <div class="splash-tag">イベントを、もっと身近に。</div>
  </div>`;
}
function attachSplashTimer(){
  if(!S.showSplash || S._splashTimerSet) return;
  S._splashTimerSet = true;
  const total = S.isFirstLaunch ? 2000 : 1300;
  setTimeout(()=>{
    S.splashHide = true;
    const el = document.getElementById('splashEl');
    if(el) el.classList.add('hide');
  }, total-450);
  setTimeout(()=>{
    S.showSplash = false;
    S._splashTimerSet = false;
    sessionStorage.setItem('ep_visited','1');
    render();
  }, total);
}

function eventCard(ev,{wide=false}={}){
  const fav = S.favorites.has(ev.id);
  const status = computeEventStatus(ev);
  let distText = "";
  if(S.userLocation && ev.lat!=null && ev.lng!=null){
    const km = haversineKm(S.userLocation.lat,S.userLocation.lng,ev.lat,ev.lng);
    if(km!=null) distText = km<1 ? `${Math.round(km*1000)}m` : `${km.toFixed(1)}km`;
  }
  return `<div class="event-card ${wide?'wide':''}" onclick="EP.openEvent('${ev.id}')">
    <div class="event-hero" style="${heroStyle(ev.category)}">
      <span class="event-cat-chip">${CAT_EMOJI[ev.category]} ${ev.category}</span>
      <button class="fav-toggle" onclick="event.stopPropagation();EP.toggleFav('${ev.id}')">${icon('heart')}</button>
      <span>${CAT_EMOJI[ev.category]}</span>
      <span class="badge ${status.cls} status-chip">${status.label}</span>
    </div>
    <div class="event-body">
      <div class="event-name">${ev.name}</div>
      <div class="event-meta">${icon('calendar')}${fmtRange(ev)}</div>
      <div class="event-meta">${icon('pin')}${ev.venue}${distText?` ・ 現在地から約${distText}`:''}</div>
    </div>
  </div>`;
}

function screenHome(){
  const header = `<div class="topbar">
    <span class="jp-display" style="font-size:20px;font-weight:800;color:var(--coral)">インパス</span>
    <button class="icon-btn" onclick="EP.go('menu')">${icon('bell')}</button>
  </div>`;
  if(S.loadingEvents){
    return header + `<div style="padding:14px 18px;">
      <div class="skeleton" style="height:110px;border-radius:20px;margin-bottom:20px;"></div>
      <div class="skeleton" style="height:14px;width:120px;margin-bottom:12px;"></div>
      <div style="display:flex;gap:12px;">${[1,2,3].map(()=>`<div class="skeleton" style="height:190px;width:230px;flex-shrink:0;"></div>`).join('')}</div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--ink-faint);padding:14px;">読み込み中…</div>`;
  }
  if(!EVENTS.length){
    return header + `<div class="empty-state"><div class="em">🎪</div>公開されているイベントはまだありません<br><span style="font-size:12px;">主催者管理画面からイベントを作成してみましょう</span></div>`;
  }
  const notEnded = EVENTS.filter(e=>computeEventStatus(e).key!=='ended');
  const ended = EVENTS.filter(e=>computeEventStatus(e).key==='ended');
  // 開催予定：開催日が近い順
  const upcoming = [...notEnded].sort((a,b)=>getEventTimes(a).start-getEventTimes(b).start).slice(0,6);
  // おすすめ：カテゴリーを散らして重複が少ないように選出（開催中・開催予定を優先、なければ終了分で補う）
  const recommended = [...notEnded, ...ended].slice(0,6);
  // 人気イベント：orgnizer-createdでない元祖サンプルを人気表示の代わりに（実データがないため、開催予定から別の並び順で選出）
  const popular = [...notEnded].sort((a,b)=>a.name.localeCompare(b.name,'ja')).slice(0,6);
  const featured = upcoming[0] || EVENTS[0];
  const featuredStatus = computeEventStatus(featured);
  const countdown = computeCountdownText(featured);

  // 近くのイベント／おすすめの出し分け（位置情報の許可状況に応じて）
  let nearSectionTitle = "おすすめイベント";
  let nearSectionBody = "";
  if(S.geoStatus==='granted' && S.userLocation){
    const withDist = notEnded.map(e=>({e,km:haversineKm(S.userLocation.lat,S.userLocation.lng,e.lat,e.lng)}))
      .filter(x=>x.km!=null).sort((a,b)=>a.km-b.km).slice(0,6);
    nearSectionTitle = "近くのイベント";
    nearSectionBody = withDist.length
      ? `<div class="hscroll">${withDist.map(x=>eventCard(x.e)).join('')}</div>`
      : `<div class="empty-state" style="padding:20px 30px;"><div class="em">📍</div>位置情報を取得できるイベントが見つかりませんでした</div>`;
  } else {
    nearSectionBody = `<div class="geo-banner">
      <span>📍 現在地を利用すると、近くのイベントを表示できます</span>
      <button onclick="EP.requestLocation()">${S.geoStatus==='loading'?'取得中…':'許可する'}</button>
    </div>` + `<div class="hscroll">${recommended.slice(0,4).map(e=>eventCard(e)).join('')}</div>`;
    nearSectionTitle = S.geoStatus==='denied' ? "おすすめイベント" : "近くのイベント";
  }

  return header + `
  <div style="margin:2px 18px 16px;padding:16px;border-radius:20px;background:linear-gradient(120deg,var(--coral-soft),var(--sun-soft));">
    <div style="font-size:11.5px;font-weight:800;color:var(--coral-dark);margin-bottom:4px;">${countdown}</div>
    <div style="font-size:16px;font-weight:800;">${featured.name}</div>
    <div style="font-size:12px;color:var(--ink-soft);margin:2px 0 10px;">${fmtRange(featured)}・${featured.venue}</div>
    <button class="btn btn-primary btn-sm" onclick="EP.openEvent('${featured.id}')">詳しく見る</button>
  </div>
  <div class="section-title">おすすめイベント</div>
  <div class="hscroll">${recommended.map(e=>eventCard(e)).join('')}</div>
  <div class="section-title">開催予定</div>
  <div class="hscroll">${upcoming.length?upcoming.map(e=>eventCard(e)).join(''):`<div class="empty-state" style="padding:20px 30px;">現在開催予定のイベントはありません</div>`}</div>
  <div class="section-title">${nearSectionTitle}</div>
  ${nearSectionBody}
  <div class="section-title">人気のイベント</div>
  <div class="hscroll">${popular.map(e=>eventCard(e)).join('')}</div>
  <div class="section-title">お気に入り<span class="more" onclick="EP.go('favorites')">すべて見る ${'>'}</span></div>
  ${S.favorites.size ? `<div class="hscroll">${EVENTS.filter(e=>S.favorites.has(e.id)).map(e=>eventCard(e)).join('')}</div>`
    : `<div class="empty-state" style="padding:24px 30px;"><div class="em">🤍</div>気になるイベントをお気に入り登録してみましょう</div>`}
  `;
}

function wmoDesc(code){
  if(code===0) return "快晴";
  if([1,2,3].includes(code)) return "晴れ〜曇り";
  if([45,48].includes(code)) return "霧";
  if([51,53,55,56,57].includes(code)) return "小雨";
  if([61,63,65,66,67].includes(code)) return "雨";
  if([71,73,75,77].includes(code)) return "雪";
  if([80,81,82].includes(code)) return "にわか雨";
  if([95,96,99].includes(code)) return "雷雨";
  return "情報なし";
}
function heatLevelFromTemp(temp){
  if(temp==null) return null;
  if(temp>=35) return "危険";
  if(temp>=31) return "警戒";
  if(temp>=28) return "注意";
  return "注意なし";
}

    <div class="heat-stat"><div class="val">${temp}℃</div><div class="lbl">気温</div></div>

    <div class="heat-stat"><div class="val">${wbgt}${wbgt!=="-"?"℃":""}</div><div class="lbl">WBGT${live?'（参考値）':''}</div></div>
  </div>
  <div class="pad" style="padding-top:0;">
    <div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">注意事項</div>
    <ul style="margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--ink-soft);line-height:1.9;">

/* チケットQRのペイロード形式: "INPASS1:{ticketId}:{eventId}"
   個人情報（氏名・メールアドレスなど）は含めない。 */
function ticketQrPayload(ticketId, eventId){ return `INPASS1:${ticketId}:${eventId}`; }

function qrSVG(ticketId, used, eventId){
  const payload = ticketQrPayload(ticketId, eventId||'');
  if(typeof window.qrcode === 'function'){
    try{
      const qr = window.qrcode(0, 'M'); // type 0 = auto size
      qr.addData(payload);
      qr.make();
      const count = qr.getModuleCount();
      const cell = 168/count;
      let rects='';
      for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){
          if(qr.isDark(r,c)) rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#2E2019"/>`;
        }
      }
      return `<svg width="168" height="168" viewBox="0 0 168 168" style="border-radius:14px;${used?'opacity:.35;filter:grayscale(1);':''}">
        <rect width="168" height="168" fill="#fff"/>
        ${rects}
        ${used?`<text x="84" y="84" text-anchor="middle" font-size="22" font-weight="800" fill="#E5484D" transform="rotate(-18 84 84)">USED</text>`:''}
      </svg>`;
    }catch(e){ /* フォールバックへ */ }
  }
  // ライブラリが読み込めなかった場合の簡易プレースホルダー（実際には読み取れません）
  return `<svg width="168" height="168" viewBox="0 0 168 168" style="border-radius:14px;${used?'opacity:.35;filter:grayscale(1);':''}">
    <rect width="168" height="168" fill="#fff"/>
    <rect x="8" y="8" width="152" height="152" rx="10" fill="none" stroke="#E5484D" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="84" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#E5484D">QR生成失敗</text>
    <text x="84" y="96" text-anchor="middle" font-size="10" fill="#8A7A6D">チケットIDで手入力してください</text>
  </svg>`;
}

function barChart(values,labels,color){
  const max=Math.max(...values,1);
  const w=260,h=90,bw=w/values.length-8;
  return `<svg width="100%" viewBox="0 0 ${w} ${h+20}">
    ${values.map((v,i)=>{
      const bh = (v/max)*h;
      const x = i*(w/values.length)+4;
      return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="4" fill="${color}"/>
        <text x="${x+bw/2}" y="${h+14}" font-size="9" fill="#8A7A6D" text-anchor="middle">${labels[i]}</text>`;
    }).join('')}
  </svg>`;
}
function lineChart(values,labels,color){
  const max=Math.max(...values,1), min=0;
  const w=340,h=100;
  const pts = values.map((v,i)=>[ (i/(values.length-1))*w, h-((v-min)/(max-min||1))*h ]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = path + ` L ${w} ${h} L 0 ${h} Z`;
  return `<svg width="100%" viewBox="0 0 ${w} ${h+22}">
    <path d="${area}" fill="${color}22"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join('')}
    ${labels.map((l,i)=>`<text x="${pts[i][0]}" y="${h+16}" font-size="9" fill="#8A7A6D" text-anchor="middle">${l}</text>`).join('')}
  </svg>`;
}

const EP = {

    if(m!=='user'){
      if(!S.currentUser){ S.showAuthModal='login'; S.authError='この機能を利用するにはログインが必要です。'; render(); return; }
      if(m==='admin' && !canSwitchTo('organizer')){ toast('主催者アカウントのみ利用できます'); return; }
      if(m==='staff' && !canSwitchTo('staff')){ toast('スタッフアカウントのみ利用できます'); return; }
    }
    S.mode=m; S.showAppModeChooser=false; if(m==='staff'){S.staffScanState='idle';} render(); scrollTop();
  },
  openLangPicker(){ S.showLangPicker=true; render(); },
  closeLangPicker(){ S.showLangPicker=false; render(); },
  setLang(l){ S.lang=l; saveLang(l); S.showLangPicker=false; render(); },
  openAppModeChooser(){ S.showAppModeChooser=true; S.appModePasswordError=''; render(); },
  closeAppModeChooser(){ S.showAppModeChooser=false; S.appModePasswordError=''; render(); },
  chooseAppMode(role){
    if(role==='user'){ EP.setMode('user'); S.showAppModeChooser=false; render(); return; }
    // 主催者・スタッフへの切り替えは、実際の権限の有無にかかわらず必ずこの確認画面を経由する。
    // これはUI上のロックであり、本当のデータ操作の可否はSupabaseのRLS/RPCがサーバー側で判定する。
    S.pendingAppMode = role;
    S.appModePasswordError='';
    render();
  },
  submitAppModePassword(){
    const pw = document.getElementById('appModePassword')?.value;
    if(pw !== DEV_MODE_PASSWORD){ S.appModePasswordError='パスワードが正しくありません。'; render(); return; }
    const target = S.pendingAppMode;
    S.devModeUnlocked = target;
    S.pendingAppMode = null;
    S.showAppModeChooser = false;
    EP.setMode(target==='organizer' ? 'admin' : 'staff');
  },
  cancelAppModePassword(){ S.pendingAppMode=null; S.appModePasswordError=''; render(); },
  requestReturnToUser(){ S.showReturnToUserConfirm=true; render(); },
  cancelReturnToUser(){ S.showReturnToUserConfirm=false; render(); },
  confirmReturnToUser(){
    S.showReturnToUserConfirm=false;
    S.devModeUnlocked=null;
    EP._stopCamera();
    S.mode='user'; S.view='home';
    render(); scrollTop();
  },
  async fetchWeather(eventId, lat, lng){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FTokyo`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('weather fetch failed');
      const data = await res.json();
      const cur = data.current || {};
      S.weatherCache[eventId] = {
        loading:false, error:false,
        temp: cur.temperature_2m, humidity: cur.relative_humidity_2m, weatherCode: cur.weather_code,
        fetchedAt: new Date(),
      };
    }catch(err){
      S.weatherCache[eventId] = {loading:false, error:true};
    }
    render();
  },
  async shareEvent(eventId){
    const ev = getEvent(eventId);
    if(!ev) return;
    const url = `${location.origin}${location.pathname}#event=${ev.id}`;
    const text = `${ev.name}\n${fmtRange(ev)} ${ev.startTime||''}〜\n${ev.venue}\n\nインパスでイベントをチェック：`;
    if(navigator.share){
      try{ await navigator.share({title:ev.name, text, url}); }
      catch(err){ /* ユーザーがキャンセルした場合は何もしない */ }
      return;
    }
    try{
      await navigator.clipboard.writeText(`${text}\n${url}`);
      toast('イベント情報をコピーしました');
    }catch(err){
      toast('共有に対応していないブラウザです');
    }
    render();
  },
  requestLocation(){
    if(!navigator.geolocation){ S.geoStatus='unsupported'; toast('このブラウザは位置情報に対応していません'); render(); return; }
    S.geoStatus='loading'; render();
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ S.userLocation={lat:pos.coords.latitude,lng:pos.coords.longitude}; S.geoStatus='granted'; toast('現在地を取得しました'); render(); },
      (err)=>{ S.geoStatus='denied'; toast('位置情報を取得できませんでした'); render(); },
      {timeout:8000}
    );
  },
  go(v){ S.view=v; render(); scrollTop(); },
  openEvent(id){ S.eventId=id; S.view='detail'; S.detailTab='概要'; S.selectedDay=null; render(); scrollTop(); },
  setDetailTab(t){ S.detailTab=t; render(); scrollTop(); },
  setDay(d){ S.selectedDay=d; render(); },

    if(!S.currentUser){ S.showAuthModal='login'; S.authError='お気に入り登録にはログインが必要です。'; render(); return; }
    // optimistic UI
    if(wasFav) S.favorites.delete(id); else S.favorites.add(id);
    render();
    try{ await DATA.toggleFavorite(id, wasFav); toast(wasFav?'お気に入りを解除しました':'お気に入りに追加しました'); }
    catch(err){ if(wasFav) S.favorites.add(id); else S.favorites.delete(id); toast(friendlyError(err)); }
    render();
  },

  async setCongestion(spot,level){

  async startScan(){
    S.scanError=null; S.scanErrorCode=null; S.staffScanState='scanning'; render();
    await EP._beginCameraScan();
  },
  retryCamera(){
    S.scanError=null; S.scanErrorCode=null; S.staffScanState='scanning'; render();
    EP._beginCameraScan();
  },
  async _waitForJsQR(timeoutMs){
    const start = Date.now();
    while(typeof window.jsQR !== 'function'){
      if(window.__jsQrLibFailed) return false;
      if(Date.now()-start > timeoutMs) return false;
      await new Promise(r=>setTimeout(r,100));
    }
    return true;
  },
  async _beginCameraScan(){
    if(S._cameraStarting){ console.log('[camera] _beginCameraScan already in progress, ignoring duplicate call'); return; }
    S._cameraStarting = true;
    const video = document.getElementById('qrVideo');
    const canvas = document.getElementById('qrCanvas');
    if(!video || !canvas){ S._cameraStarting=false; return; }

    // 1) HTTPS（安全なコンテキスト）かどうか
    if(!window.isSecureContext){
      S.staffScanState='idle'; S.scanErrorCode='insecure'; S.scanError=t('cam_insecure'); S._cameraStarting=false; render(); return;
    }
    // 2) mediaDevices / getUserMedia が存在するか
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      S.staffScanState='idle'; S.scanErrorCode='unsupported'; S.scanError=t('cam_unsupported'); S._cameraStarting=false; render(); return;
    }

    // 3) 読み取り方式を決定：優先順位 ① ブラウザ内蔵のBarcodeDetector API（追加ライブラリ不要）
    //    ② アプリに同梱したQRライブラリ（jsQR） ③ 見つからなければエラー
    let detectorMode = null; // 'native' | 'jsqr'
    let barcodeDetector = null;
    if('BarcodeDetector' in window){
      try{
        const formats = await window.BarcodeDetector.getSupportedFormats();
        if(formats.includes('qr_code')){
          barcodeDetector = new window.BarcodeDetector({formats:['qr_code']});
          detectorMode = 'native';
        }
      }catch(e){ console.error('BarcodeDetector unavailable:', e); }
    }
    if(!detectorMode){
      const libOk = await EP._waitForJsQR(3000);
      if(!libOk){
        S.staffScanState='idle'; S.scanErrorCode='library'; S.scanError=t('cam_library'); S._cameraStarting=false; render(); return;
      }
      detectorMode = 'jsqr';
    }
    S.debugInfo = {detector:detectorMode, scanning:false, videoW:0, videoH:0};

    try{
      // iPhone Safari対策：直前にカメラを停止した場合、OS側の解放が
      // 完了する前に再度リクエストすると失敗することがあるため少し待つ
      await new Promise(r=>setTimeout(r,250));
      // 4) カメラへのアクセスを要求（スマホでは可能な限り背面カメラを使用）
      const constraints = { audio:false, video: S.preferredCameraId
        ? { deviceId:{exact:S.preferredCameraId} }
        : { facingMode:{ideal:'environment'} } };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      console.log('[camera] getUserMedia succeeded, tracks:', stream.getTracks().map(t=>t.label));
      S.cameraStream = stream;
      video.srcObject = stream;
      stream.getTracks().forEach(track=>{
        track.addEventListener('ended', ()=>{
          console.log('[camera] track ended unexpectedly (readyState=ended). This usually means the OS/browser reclaimed the camera, not our own code.');
        });
      });
      await video.play();
      console.log('[camera] video.play() resolved, video is now playing');

      // 5) 権限取得後に利用可能なカメラを列挙（切り替え用）
      try{
        const devices = await navigator.mediaDevices.enumerateDevices();
        S.cameraList = devices.filter(d=>d.kind==='videoinput');
      }catch(e){ S.cameraList = []; }

      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      const tick = async ()=>{
        if(S.staffScanState!=='scanning') return; // 画面が切り替わったら停止
        // video.readyState だけでなく、実際にフレームの幅・高さが
        // 確定しているかも確認する（iPhoneで「映像は出るが解析されない」
        // 状態の主な原因の一つ）。
        const ready = video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0;
        if(ready && !S._decoding){
          S._decoding = true;
          let text = null;
          if(detectorMode==='native'){
            try{
              const results = await barcodeDetector.detect(video);
              if(results && results.length){ text = results[0].rawValue; }
            }catch(e){ console.error('BarcodeDetector decode error:', e); }
          }else{
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video,0,0,canvas.width,canvas.height);
            const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
            try{
              // inversionAttempts:"attemptBoth" は、印刷物だけでなく
              // 「別の画面に表示されたQRコード」を読み取る今回のケースで
              // 認識率に大きく影響するため明示的に指定する。
              const code = window.jsQR(imgData.data, imgData.width, imgData.height, {inversionAttempts:"attemptBoth"});
              if(code && code.data) text = code.data;
            }catch(e){ console.error('jsQR decode error:', e); }
          }
          S._decoding = false;
          if(text){
            S.debugInfo = {...S.debugInfo, lastDetected:text};
            EP._stopCamera();
            EP.handleScannedText(text);
            return;
          }
        }
        if(S.debugPanelOn){
          S.debugInfo = {...S.debugInfo, videoW:video.videoWidth, videoH:video.videoHeight, detector:detectorMode, scanning:true};
          const dbg = document.getElementById('qrDebugPanel');
          if(dbg) dbg.innerHTML = renderDebugPanelHTML();
        }
        S.scanRAF = requestAnimationFrame(tick);
      };
      S.scanRAF = requestAnimationFrame(tick);
      // 重要：ここで render() を呼ぶと innerHTML 全体が再構築され、
      // 今まさに映像を映している <video> 要素ごと作り直されて真っ黒になる
      // （特にiPhoneで顕著）。カメラ切り替えUIだけをその場で差し込む。
      const slot = document.getElementById('cameraSwitcherSlot');
      if(slot) slot.innerHTML = renderCameraSwitcherHTML();
      S._cameraStarting = false;
    }catch(err){
      console.error('camera start failed:', err);
      EP._stopCamera();
      S.staffScanState='idle';
      const name = err && err.name;
      if(name==='NotAllowedError' || name==='PermissionDeniedError'){ S.scanErrorCode='permission'; }
      else if(name==='NotFoundError' || name==='DevicesNotFoundError'){ S.scanErrorCode='notfound'; }
      else { S.scanErrorCode='other'; }
      S.scanError = t('cam_'+S.scanErrorCode);
      S._cameraStarting = false;
      render();
    }
  },
  async switchCamera(deviceId){
    S.preferredCameraId = deviceId || null;
    EP._stopCamera();
    S.staffScanState='scanning'; render();
    await EP._beginCameraScan();
  },
  _stopCamera(){
    if(S.cameraStream) console.log('[camera] stopping camera stream. stack:', new Error().stack);
    if(S.scanRAF) cancelAnimationFrame(S.scanRAF);
    S.scanRAF=null;
    if(S.cameraStream){ S.cameraStream.getTracks().forEach(t=>t.stop()); S.cameraStream=null; }
    // iPhone Safari対策：video要素にストリームの参照が残っていると、
    // 次回 getUserMedia() が正しく動作しないことがあるため明示的に解放する
    try{
      const v = document.getElementById('qrVideo');
      if(v){ v.pause(); v.srcObject = null; }
    }catch(e){}
  },
  handleScannedText(text){
    const parts = String(text).split(':');
    let ticketId = text, scannedEventId = null;
    if(parts[0]==='INPASS1' && parts.length>=3){ ticketId = parts[1]; scannedEventId = parts[2]; }
    S.staffScanState='verifying'; S.verifyingTicketId=ticketId; render();
    evaluateCheckin(ticketId, scannedEventId);
  },
  cancelScan(){
    EP._stopCamera();
    S.staffScanState='idle'; S.scanError=null; S.scanErrorCode=null; render();
    setTimeout(()=>document.getElementById('manualTicketId')?.focus(), 50);
  },
  manualCheckin(){
    const val = document.getElementById('manualTicketId').value.trim();
    if(!val){ toast(S.lang==='en'?'Please enter a ticket ID':'チケットIDを入力してください'); render(); return; }
    evaluateCheckin(val, null);
  },
  resetScan(){ EP._stopCamera(); S.staffScanState='idle'; S.staffResult=null; S.scanError=null; S.scanErrorCode=null; render(); },

  /* ---- Auth ---- */
  openAuth(view){ S.showAuthModal=view; S.authError=''; render(); },
  closeAuth(){ S.showAuthModal=null; S.authError=''; render(); },
  async submitAuth(view){
    const email = document.getElementById('authEmail')?.value.trim();

    S.authError='';

      S.authLoading=false; render(); return;

    if(view==='reset' && CLOUD_MODE){
      if(!email){ S.authError='メールアドレスを入力してください。'; render(); return; }
      S.authLoading=true; render();
      try{

        S.showAuthModal=null; toast('パスワード再設定用のメールを送信しました。メール内のリンクをご確認ください。');
      }catch(err){ S.authError = friendlyError(err); }
      S.authLoading=false; render(); return;
    }
    if(!email || !password){ S.authError='メールアドレスとパスワードを入力してください。'; render(); return; }

      S.showAuthModal=null; toast(view==='signup'?'アカウントを作成しました':'ログインしました');

  },

async function evaluateCheckin(id, scannedEventId){
  const evId = S.adminEditingEventId; // このスタッフ画面が対象とするイベント
  if(scannedEventId && scannedEventId!==evId){
    S.staffResult = {status:'invalid', id, error: S.lang==='en' ? 'This ticket is not for this event.' : 'このイベント用のチケットではありません（担当外のQRコードです）'};
    S.staffScanState='result'; render(); return;
  }
  try{
    const res = await DATA.checkInTicket(id, evId);
    S.staffResult = {status:res.status, id:res.ticketId||id, typeName:res.typeName};
  }catch(err){
    console.error('checkInTicket failed:', err);
    S.staffResult = {status:'invalid', id, error:friendlyError(err)};
  }
  S.staffScanState='result'; render();
}
function toast(msg){ S.toastMsg=msg; }
function scrollTop(){ const el=document.getElementById('scr'); if(el) el.scrollTop=0; }
window.addEventListener('beforeunload', ()=>{ try{ EP._stopCamera(); }catch(e){} });
let _hideTimer = null;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    // 許可ダイアログの表示など、一瞬だけ visibilitychange が誤発火することがあるため、
    // 短時間のうちに元に戻った場合はカメラを止めない（実際にアプリを離れた場合のみ停止）
    if(_hideTimer) clearTimeout(_hideTimer);
    _hideTimer = setTimeout(()=>{
      if(document.hidden){
        try{ EP._stopCamera(); if(S.staffScanState==='scanning'){ S.staffScanState='idle'; render(); } }catch(e){}
      }
    }, 800);
  }else{
    if(_hideTimer){ clearTimeout(_hideTimer); _hideTimer=null; }
  }
});

window.addEventListener('unhandledrejection', (e)=>{ console.error('Unhandled promise rejection:', e.reason); });

      <button class="btn btn-primary" ${S.authLoading?'disabled':''} onclick="EP.submitAuth('${view}')">${S.authLoading?'<span class="spinner"></span>処理中…':(view==='login'?'ログイン':view==='signup'?'アカウントを作成':(CLOUD_MODE?'再設定メールを送信':'パスワードを再設定'))}</button>
      <div class="form-note">
        ${view==='login'?'アカウントをお持ちでない方は「新規登録」タブへ。パスワードをお忘れの場合は「再設定」タブから再設定できます。':''}
        ${view==='signup'?'登録後は一般ユーザーとしてご利用いただけます。主催者・スタッフ権限は運営による付与が必要です。':''}
        ${view==='reset' ? (CLOUD_MODE
          ? '登録済みのメールアドレス宛に、パスワード再設定用の安全なリンクを送信します。メール内のリンクを開くと、新しいパスワードを設定する画面が表示されます。'
          : 'このアプリはサーバーを使わないため、メールでの本人確認はできません。登録済みのメールアドレスを入力し、新しいパスワードをそのまま設定してください。') : ''}
      </div>
    </div>
  </div>`;
}

/* ---------- Status banners ---------- */
function renderStatusBanners(){
  let html='';
  if(!S.storageOK) html += `<div class="status-banner offline">⚠ このブラウザではデータの保存ができません（プライベートブラウジング中など）。一部の操作が保存されない場合があります。</div>`;
  return html;
}

/* ---------- init ---------- */
S.isFirstLaunch = !sessionStorage.getItem('ep_visited');
S.showSplash = true;
S.splashHide = false;
render();
DATA.init();

// register service worker for PWA install / offline shell (non-blocking, safe to fail in sandboxed preview)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      // 新しいバージョンのService Workerが見つかったら、次回起動時に反映されるよう案内する
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            toast(S.lang==='en' ? 'A new version is available. Reload to update.' : '新しいバージョンがあります。再読み込みすると更新されます。');
            render();
          }
        });
      });
    }).catch((err)=>{ console.error('Service worker registration failed:', err); });
  });
}
</script>
</body>
</html>
